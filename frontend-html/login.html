<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Campus Connect</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

    <!-- Public Header -->
    <header class="public-header">
        <div class="container public-nav">
            <a href="index.html" class="brand-logo">
                <span class="brand-icon">🎓</span>
                <span>Smart Campus Connect</span>
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="events.html">Events</a></li>
                    <li><a href="register.html">Student Registration</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2.5rem 1rem;">
        <div class="card animate-fade-in" style="width: 100%; max-width: 480px; padding: 2.5rem;">
            
            <div style="text-align: center; margin-bottom: 2rem;">
                <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔐</div>
                <h2>Campus Portal Login</h2>
                <p class="text-muted" style="font-size: 0.9rem;">Sign in to access your role-based dashboard</p>
            </div>

            <!-- Alert Container for dynamic JS messages -->
            <div id="loginAlert" style="display: none;"></div>

            <!-- Login Form -->
            <form id="loginForm" novalidate>
                
                <div class="form-group">
                    <label class="form-label" for="username">Username or Campus Email</label>
                    <input type="text" id="username" class="form-input" placeholder="e.g. rahul_v or admin@smartcampus.edu" required autocomplete="username">
                    <div class="form-error"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                    <div class="form-error"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="padding: 0.75rem; font-size: 1rem; margin-top: 1rem;">
                    Sign In to Portal
                </button>
            </form>

            <!-- Quick Demo Credentials for Viva / Evaluation -->
            <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px dashed var(--border);">
                <span style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 0.75rem;">
                    ⚡ 1-Click Demo Accounts (Password: Password@123)
                </span>
                <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <button type="button" class="btn btn-sm btn-secondary" onclick="fillCredentials('rahul_v', 'Password@123')">
                        👨‍🎓 Student Demo (Rahul Verma)
                    </button>
                    <button type="button" class="btn btn-sm btn-secondary" onclick="fillCredentials('prof_sharma', 'Password@123')">
                        👩‍🏫 Faculty Demo (Prof. Rajesh Sharma)
                    </button>
                    <button type="button" class="btn btn-sm btn-secondary" onclick="fillCredentials('admin', 'Password@123')">
                        🏛️ Administrator Demo (Principal)
                    </button>
                </div>
            </div>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem;">
                <span class="text-muted">New student seeking admission?</span>
                <a href="register.html" style="font-weight: 600; margin-left: 0.25rem;">Register Here</a>
            </div>

        </div>
    </main>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function fillCredentials(user, pass) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
            Validators.clearError(document.getElementById('username'));
            Validators.clearError(document.getElementById('password'));
        }
    </script>
</body>
</html>
